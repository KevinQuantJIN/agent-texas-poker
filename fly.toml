app = "agent-texas-poker"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  GAME_SERVER_PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
